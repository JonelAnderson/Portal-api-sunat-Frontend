# Cabeceras de seguridad (se incluyen en cada location: un add_header dentro de una location anula los del server).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# CSP: solo código de este mismo sitio (defensa principal contra XSS). Probada con la compilación de producción:
#   script-src 'self' (sin scripts en línea: angular.json tiene inlineCritical: false), connect-src 'self' (la API va por /api),
#   style-src 'unsafe-inline' (Angular y las librerías ponen estilos en línea; no ejecutan código).
# Un recurso externo nuevo exige ampliar la CSP a propósito.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# HSTS solo si se entró por HTTPS: $erp_hsts está vacío con HTTP y nginx no la envía.
add_header Strict-Transport-Security $erp_hsts always;
