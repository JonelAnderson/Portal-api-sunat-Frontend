# nginx de Portal de clientes API SUNAT (frontend): sirve la SPA y reenvía a la API por el mismo origen.
#   /api/portal/  ->  sunat-api:8081  (red compartida de Coolify, ver docker-compose.coolify.yml)
# No se publican /swagger, /actuator ni /health: solo se alcanzan dentro de la red de Docker.

# Si delante hay un proxy con TLS (Traefik de Coolify), se respeta su X-Forwarded-Proto; si no, el esquema de esta conexión.
map $http_x_forwarded_proto $app_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# HSTS (security-headers.conf) solo cuando la conexión es HTTPS; con HTTP queda vacío y la cabecera no se envía.
map $app_forwarded_proto $erp_hsts {
    https   "max-age=31536000";
    default "";
}

# Docker DNS (127.0.0.11): el nombre del backend se resuelve en cada petición (10 s de caché) y no solo al arrancar:
# nginx arranca aunque el backend aún no exista (responde 502 hasta entonces) y sigue al backend cuando se redespliega con otra IP.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # $http_host conserva el puerto y el dominio público: la API arma con él las URLs de los archivos y los enlaces.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $app_forwarded_proto;

    location /api/portal/ {
        include /etc/nginx/snippets/security-headers.conf;
        set $api_upstream sunat-api:8081;
        proxy_pass http://$api_upstream;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # index.html nunca en caché: así cada despliegue carga los archivos nuevos (los demás llevan hash en el nombre).
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # SPA: cualquier ruta del frontend (recargar o abrir un enlace) devuelve index.html.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
