@if (!item().hidden) {
<li class="nav-item pcoded-menu-caption">
  <label>{{ item().title | translate }}</label>
</li>
@for (items of item().children; track items.id) {

@if (items.type === 'collapse') {
<app-nav-collapse [item]="items" [parentRole]="item().role" />
}
@if (items.type === 'item') {
<app-nav-item [item]="items" [parentRole]="item().role" />
}

}
}
