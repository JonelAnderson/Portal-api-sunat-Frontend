name: Deploy Portal de clientes API SUNAT (frontend) - Production
on:
  push:
    branches: [deploy-prod]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify Deployment
        run: |
          echo "Notificando a Coolify para iniciar el despliegue..."
          curl --fail --request GET '${{ secrets.COOLIFY_PROD_URL }}' \
               --header 'Authorization: Bearer ${{ secrets.COOLIFY_PROD_TOKEN }}'
